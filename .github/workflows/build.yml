name: Build CASTOR-ETC

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:      # keep the manual-trigger button

jobs:
  # ==========================================
  # 1. Validation job (runs automatically on every push or PR)
  # ==========================================
  test:
    name: 🧪 Validate & Test (Ubuntu)
    runs-on: ubuntu-latest  # Ubuntu is the fastest for testing
    steps:
    - name: 📥 Check out code
      uses: actions/checkout@v4

    - name: ⚡ Install & configure uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: 📦 Install dependencies
      run: uv sync

    - name: 🧪 Run automated tests (Pytest)
      run: uv run pytest

  # ==========================================
  # 2. Windows packaging job (runs only on manual dispatch)
  # ==========================================
  build-windows:
    name: 🏗️ Package Windows build
    needs: test  # start packaging only after tests pass
    if: github.event_name == 'workflow_dispatch' # 👈 key: runs only on manual dispatch
    runs-on: windows-latest
    steps:
    - name: 📥 Check out code
      uses: actions/checkout@v4

    - name: ⚡ Install & configure uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: 📦 Install dependencies (prod only)
      run: uv sync --no-dev

    - name: 🏗️ Build executable (Windows)
      run: uv run pyinstaller --clean --noconfirm build.spec

    - name: 📤 Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: CASTOR-ETC-Windows
        path: dist/CASTOR-ETC.exe

  # ==========================================
  # 3. macOS packaging job (runs only on manual dispatch)
  # ==========================================
  build-macos:
    name: 🏗️ Package macOS build
    needs: test  # start packaging only after tests pass
    if: github.event_name == 'workflow_dispatch' # 👈 key: runs only on manual dispatch
    runs-on: macos-latest
    steps:
    - name: 📥 Check out code
      uses: actions/checkout@v4

    - name: ⚡ Install & configure uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: 📦 Install dependencies (prod only)
      run: uv sync --no-dev

    - name: 🏗️ Build executable (macOS)
      run: uv run pyinstaller --clean --noconfirm build.spec

    - name: 🗜️ Compress the Mac app
      run: |
        cd dist
        zip -r CASTOR-ETC-macOS.zip CASTOR-ETC.app

    - name: 📤 Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: CASTOR-ETC-macOS
        path: dist/CASTOR-ETC-macOS.zip
